<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CORE | Find us everywhere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#14206b;--sub:#5a6794;--teal:#22c5d8;--line:#d5e6ef;--btn:#14206b;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 18px 40px}
main{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{background:#fff;border-radius:22px;padding:6px 14px;width:100%;max-width:300px;border:1px solid var(--line)}
.logo img{width:100%;display:block}
.owl{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:12px 16px 12px 12px}
.owl img{width:86px;height:86px;border-radius:50%;object-fit:cover;object-position:50% 12%;border:3px solid var(--teal);flex:none;background:#eee}
.owl h1{font-family:Fraunces,Georgia,serif;font-size:1.5rem;line-height:1.1}
.owl p{color:var(--sub);font-size:.92rem;margin-top:4px;line-height:1.35}
.links{display:flex;flex-direction:column;gap:12px;width:100%}
.link{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;transition:transform .15s,border-color .15s}
.link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--teal);outline:none}
.link:focus-visible{box-shadow:0 0 0 3px var(--teal)}
.ico{width:46px;height:46px;border-radius:14px;background:var(--btn);color:var(--btnink);display:grid;place-items:center;flex:none}
.ico svg{width:24px;height:24px}
.txt{display:flex;flex-direction:column}
.txt b{font-weight:600;font-size:1.05rem}
.txt small{color:var(--sub);font-size:.85rem}
footer{color:var(--sub);font-size:.8rem}
@media (prefers-reduced-motion:reduce){.link{transition:none}}
</style></head>
